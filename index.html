<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IC Store - Katalog & Cek</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:600px;margin:auto;padding:20px 15px 50px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:16px;margin:0 0 10px;color:#0f172a}.search{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-bottom:8px}
.btn{border:0;background:#0f172a;color:#fff;border-radius:10px;padding:12px;font-weight:800;width:100%;cursor:pointer}
.result{background:#f8fafc;border-radius:10px;padding:14px;margin-top:12px;font-size:13px;display:none;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center;font-size:11px}
.footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:30px}
</style>
</head>
<body>

<main class="wrap">
  <!-- PANEL CEK -->
  <div class="panel">
    <h1>🔎 Cek Nomor & Paket</h1>
    <input id="number" class="search" placeholder="08xxxxxxxxxx" inputmode="numeric">
    <button class="btn" onclick="checkNumber()">Periksa Nomor</button>
    <div id="numberResult" class="result"></div>
  </div>

  <div class="panel">
    <h1>📍 Cek Area</h1>
    <input id="cityInput" class="search" placeholder="Contoh: Semarang">
    <button class="btn" onclick="checkCity()">Cari Area</button>
    <div id="cityResult" class="result"></div>
  </div>

  <!-- PANEL STOK -->
  <div class="panel">
    <h1>📦 Stok Produk</h1>
    <input id="stockSearch" class="search" placeholder="Cari kode...">
    <div id="stockList" class="grid"></div>
  </div>

  <div class="footer">Copyright © IC™ 2026</div>
</main>

<script>
const CREDENTIALS = {
  apiKey: "mayu_262794d5d80f0d65359b3d0834bae55c73cb55ed793dae58ed8f46493027b5c5",
  xClient: "9951786330457fbb6300783a",
  xPax: "3e8d4a7c1f9b2d6e5a8c3f7b1d4e9a2c6f8d3e1b5a7c9d2e4f6a8b1c3d5e7f9"
};

let products = [];

async function checkNumber() {
  const n = document.getElementById("number").value.trim();
  const r = document.getElementById("numberResult");
  if (!/^08\d{8,11}$/.test(n)) return alert("Format harus 08xxx");
  
  r.style.display = "block"; r.innerHTML = "⏳ Memproses...";
  try {
    const res = await fetch('https://api.ics-store.my.id/api/v1/sidompul/cek', {
      method: 'POST',
      headers: { 
        'Authorization': `Bearer ${CREDENTIALS.apiKey}`,
        'X-Client': CREDENTIALS.xClient,
        'Content-Type': 'application/json' 
      },
      body: JSON.stringify({ "nomer": n, "x-pak": CREDENTIALS.xPax })
    });
    const data = await res.json();
    if(data.status === "success") {
      r.innerHTML = `✅ ${data.data.info_kartu.operator} | ${data.data.info_kartu.masa_aktif}<br>📦 ${data.data.info_paket[0]?.nama_paket || 'No Paket'}`;
    } else { r.innerHTML = "❌ " + data.keterangan; }
  } catch(e) { r.innerHTML = "❌ Gagal koneksi."; }
}

async function fetchProducts() {
  const res = await fetch('https://api.ics-store.my.id/api/reseller/products', {
    headers: { 'Authorization': 'Bearer 9f31c11bacdcc071d6d689e21f5cef36417068fe1dd60f8f', 'x-client': CREDENTIALS.xClient, 'x-pax': CREDENTIALS.xPax, 'x-api-key': CREDENTIALS.apiKey }
  });
  const json = await res.json();
  if(json.success) {
    products = json.data;
    renderStock();
  }
}

function renderStock() {
  const q = document.getElementById("stockSearch").value.toLowerCase();
  const html = products.filter(p => p.code.toLowerCase().includes(q)).map(p => 
    `<div class="card"><b>${p.code}</b><br>${p.stock > 0 ? '🟢' : '🔴'}</div>`
  ).join('');
  document.getElementById("stockList").innerHTML = html;
}

function checkCity() {
  const k = document.getElementById("cityInput").value.toLowerCase();
  const match = products.filter(p => p.description.toLowerCase().includes(k));
  document.getElementById("cityResult").style.display = "block";
  document.getElementById("cityResult").innerHTML = match.length ? match.map(m=>m.code).join(', ') : "Tidak ada.";
}

document.getElementById("stockSearch").addEventListener("input", renderStock);
fetchProducts();
</script>
</body>
</html>
