<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cek Stok Langsung</title>
</head>
<body>
<div id="status" style="padding:20px; font-family:sans-serif;">Memulai koneksi langsung ke supplier...</div>
<div id="container" style="padding:20px;"></div>

<script>
async function ambilData() {
  const status = document.getElementById("status");
  try {
    status.textContent = "Menghubungkan ke API Supplier...";
    
    // Kita panggil langsung ke supplier
    const response = await fetch('https://api.ics-store.my.id/api/reseller/products', {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer 9f31c11bacdcc071d6d689e21f5cef36417068fe1dd60f8f',
        'Accept': 'application/json'
      }
    });

    const data = await response.json();
    status.textContent = "Data berhasil diambil!";
    document.getElementById("container").innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
  } catch (err) {
    status.textContent = "Gagal total: " + err.message;
    console.error(err);
  }
}
ambilData();
</script>
</body>
</html>
