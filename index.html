<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JuraganXL - Informasi Produk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}
.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.topin,.wrap{max-width:1080px;margin:auto}.title{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}.subtitle{font-size:11px;color:#6b7280}
.nav{background:#fff;border-bottom:1px solid #e5e7eb;display:flex;overflow:auto;padding:0 10px;position:sticky;top:0;z-index:4}.nav button{border:0;background:none;color:#6b7280;padding:14px 12px;font-weight:800;white-space:nowrap;cursor:pointer}.nav button.active{color:#111827;border-bottom:2px solid #111827}
.wrap{padding:18px 15px 75px}.page{display:none}.page.active{display:block}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:13px}.panel h1,.panel h2{margin:0 0 5px}.panel h1{font-size:20px}.panel h2{font-size:16px}.muted{font-size:12px;color:#6b7280;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.stat b{display:block;font-size:18px}.stat small{font-size:10px;color:#6b7280}
.btn{border:0;background:#111827;color:#fff;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer}.btn.light{background:#e5e7eb;color:#111827}.btn.full{width:100%;margin-top:10px}
.search{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:12px;outline:none;background:#fff}.filters{display:flex;gap:7px;overflow:auto;margin-top:10px}.filter{border:0;background:#e5e7eb;border-radius:9px;padding:9px 12px;font-weight:800;white-space:nowrap;cursor:pointer}.filter.on{background:#111827;color:white}
.section{background:transparent;border:0;border-radius:16px;overflow:hidden;margin:13px 0}.head{text-align:center;padding:14px 15px}.head b{font-size:18px}.head small{color:#9ca3af;display:block;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:2px}
.card{border:1px solid #e5e7eb;border-radius:16px;padding:16px;cursor:pointer;background:#fff;position:relative;box-shadow:0 2px 6px rgba(0,0,0,0.02)}
.card:hover{box-shadow:0 5px 16px rgba(0,0,0,0.06)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-weight:900;font-size:16px;color:#111827}
.badge-habis{font-size:10px;font-weight:900;border-radius:99px;padding:4px 10px;background:#fee2e2;color:#b91c1c}
.badge-ready{font-size:10px;font-weight:900;border-radius:99px;padding:4px 10px;background:#dcfce7;color:#15803d}
.slot-label{font-size:10px;color:#6b7280;font-weight:700;margin-top:10px;text-transform:uppercase}
.slot-val{font-size:24px;font-weight:900;color:#111827;margin-bottom:8px}
.area-list{border-top:1px solid #f3f4f6;padding-top:8px;margin-top:8px;display:none}
.card.expanded .area-list{display:block}
.area-row{display:flex;justify-content:space-between;font-size:12px;color:#4b5563;padding:3px 0}
.area-row b{color:#111827}
.toggle-detail{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:#b91c1c;border-top:1px solid #f3f4f6;padding-top:8px;margin-top:8px}
.toggle-detail.ready-text{color:#15803d}
.result{background:#f8fafc;border-radius:12px;padding:13px;margin-top:12px;font-size:13px;line-height:1.8;display:none}.row{display:flex;gap:8px}.row>*{flex:1}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="title"><span style="color:#0284c7">xl</span> JuraganXL</div>
  <div class="subtitle" id="updateTime">02:02 WIB</div>
</header>
<nav class="nav">
<button class="active" onclick="go('stok',this)">📦 Stok</button>
<button onclick="go('produk',this)">📋 Produk</button>
<button onclick="go('area',this)">📍 Cek Area</button>
<button onclick="go('nomor',this)">🔎 Cek Nomor</button>
</nav>

<main class="wrap">
<section id="stok" class="page active">
<div class="panel">
  <input id="stockSearch" class="search" placeholder="🔎 Cari kode produk (misal: XDA19)...">
  <div class="filters">
    <button class="filter on" data-v="ALL" onclick="setFilter('ALL', this)">SEMUA</button>
    <button class="filter" data-v="V1" onclick="setFilter('V1', this)">V1 (XLA)</button>
    <button class="filter" data-v="V2" onclick="setFilter('V2', this)">V2 (XDA)</button>
    <button class="filter" data-v="V3" onclick="setFilter('V3', this)">V3 (KDA)</button>
    <button class="filter" data-v="V4" onclick="setFilter('V4', this)">V4 (XLF)</button>
    <button class="filter" data-v="V5" onclick="setFilter('V5', this)">V5 (PDA)</button>
  </div>
</div>
<div id="stockList"></div>
</section>

<section id="produk" class="page">
<div class="panel"><h1>📋 Semua Produk</h1><input id="productSearch" class="search" style="margin-top:12px" placeholder="🔎 Cari produk..."></div>
<div id="productList"></div>
</section>

<section id="area" class="page">
<div class="panel">
<h1>📍 Cek Area Produk</h1>
<div class="row" style="margin-top:12px"><input id="cityInput" class="search" placeholder="Contoh: Semarang, Solo"><button class="btn" onclick="checkCity()">CEK</button></div>
</div>
<div id="cityResult"></div>
</section>

<section id="nomor" class="page">
<div class="panel"><h1>🔎 Cek Nomor</h1><input id="number" class="search" style="margin-top:12px" placeholder="08xxxxxxxxxx" inputmode="numeric"><button class="btn full" onclick="checkNumber()">CEK</button><div id="numberResult" class="result"></div></div>
</section>
</main>

<script>
let products = [];
let activeVersion = "ALL";

function go(id,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  window.scrollTo(0,0);
}

async function fetchProducts() {
  try {
    const res = await fetch('https://api.ics-store.my.id/api/reseller/products', {
      method: 'GET',
      headers: { 'Authorization': 'Bearer 9f31c11bacdcc071d6d689e21f5cef36417068fe1dd60f8f', 'Accept': 'application/json' }
    });
    const result = await res.json();
    if (result.success && Array.isArray(result.data)) {
      products = result.data.map(item => {
        const code = (item.code || "").toUpperCase();
        let v = "OTHER";
        if (code.startsWith("XLA")) v = "V1";
        else if (code.startsWith("XDA")) v = "V2";
        else if (code.startsWith("KDA")) v = "V3";
        else if (code.startsWith("XLF")) v = "V4";
        else if (code.startsWith("PDA")) v = "V5";

        // Parsing teks area 1-4 secara otomatis dari deskripsi API jika ada angka GB
        let desc = item.description || "";
        let areas = { a1: "-", a2: "-", a3: "-", a4: "-" };
        
        // Contoh regex sederhana mendeteksi angka dalam deskripsi per baris/area
        const lines = desc.split("\n");
        let idx = 1;
        lines.forEach(l => {
          let match = l.match(/(\d+\s*GB)/i);
          if (match && idx <= 4) {
            areas['a' + idx] = match[0];
            idx++;
          }
        });

        return {
          v: v,
          code: item.code,
          name: item.name,
          stock: item.stock !== undefined ? Number(item.stock) : 0,
          areas: areas
        };
      }).filter(p => p.v !== "OTHER");
      
      renderStock();
      renderProducts();
    }
  } catch (err) { console.error(err); }
}

function setFilter(v, btn) {
  activeVersion = v;
  document.querySelectorAll(".filters .filter").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  renderStock();
}

function toggleCard(elem) {
  elem.classList.toggle("expanded");
  const toggleText = elem.querySelector(".toggle-detail");
  if (elem.classList.contains("expanded")) {
    toggleText.innerHTML = `Tutup Detail <span>▲</span>`;
  } else {
    toggleText.innerHTML = `Stok Habis <span>▼</span>`;
  }
}

function renderStock(){
  const q = (document.getElementById("stockSearch").value || "").toLowerCase();
  const arr = products.filter(p => (activeVersion === "ALL" || p.v === activeVersion) && `${p.name} ${p.code}`.toLowerCase().includes(q));
  
  const groups = {};
  arr.forEach(p => (groups[p.v] ??=[]).push(p));
  
  let out = "";
  for(const [v, items] of Object.entries(groups)){
    out += `<div class="head"><b>Produk ${v}</b><small>${items.length} item</small></div><div class="grid">`;
    items.forEach(p => {
      const isReady = p.stock > 0;
      out += `<div class="card" onclick="toggleCard(this)">
        <div class="card-top">
          <div class="name">${p.code}</div>
          <span class="${isReady ? 'badge-ready' : 'badge-habis'}">${isReady ? 'READY' : 'HABIS'}</span>
        </div>
        <div class="slot-label">Slot</div>
        <div class="slot-val">${p.stock}</div>
        
        <div class="area-list">
          <div class="area-row"><span>Area 1</span><b>${p.areas.a1}</b></div>
          <div class="area-row"><span>Area 2</span><b>${p.areas.a2}</b></div>
          <div class="area-row"><span>Area 3</span><b>${p.areas.a3}</b></div>
          <div class="area-row"><span>Area 4</span><b>${p.areas.a4}</b></div>
        </div>
        
        <div class="toggle-detail ${isReady ? 'ready-text' : ''}">
          ${isReady ? 'Lihat Detail' : 'Stok Habis'} <span>▼</span>
        </div>
      </div>`;
    });
    out += "</div>";
  }
  document.getElementById("stockList").innerHTML = out || '<div style="text-align:center;padding:30px;color:#9ca3af">Tidak ada produk ditemukan.</div>';
}

function renderProducts(){
  const q = (document.getElementById("productSearch").value || "").toLowerCase();
  const arr = products.filter(p => `${p.name} ${p.code}`.toLowerCase().includes(q));
  document.getElementById("productList").innerHTML = `<div class="grid">${arr.map(p=>`<div class="card"><div class="name">${p.code}</div><div style="font-size:12px;color:#6b7280;margin-top:5px">${p.name}</div><div style="margin-top:10px;font-weight:900">Stok: ${p.stock}</div></div>`).join("")}</div>`;
}

function checkNumber(){
  const n = document.getElementById("number").value.trim();
  const r = document.getElementById("numberResult");
  r.style.display = "block";
  r.innerHTML = /^08\d{8,11}$/.test(n) ? `Nomor: <b>${n}</b><br>Status: <b style="color:#15803d">🟢 Valid & Bisa Diproses</b>` : `❌ Nomor tidak valid.`;
}

function checkCity(){
  document.getElementById("cityResult").innerHTML = `<div class="panel">Hasil deteksi area aktif dan siap dipesan.</div>`;
}

fetchProducts();
</script>
</body>
</html>
